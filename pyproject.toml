[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envee"
version = "0.2.0"
description = "From an empty directory to a verified development environment."
requires-python = ">=3.12"
dependencies = ["click>=8.1.8,<9", "rich>=13.9,<15"]
readme = "README.md"
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1", "build>=1.3,<2"]

[project.scripts]
envee = "envee_bootstrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
envee_bootstrap = ["project_runner.py", "assets/ponytail/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
